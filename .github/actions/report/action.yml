name: Report a quality bot
description: >-
  Posts what devtools/qualitybot.cpp wrote: the status on the commit, the comment as the job summary, and on a pull
  request from this repository the sticky comment, found by its first line's hidden marker and updated on every rerun.
  A pull request from a fork has a read-only token: it gets the summary only. On main the figures become an artefact
  named after the directory (`*-report`), which main.yml's record job adds to the ci-metrics branch.
inputs:
  directory:
    description: where qualitybot wrote comment.md, status.json and figures.csv, named `<bot>-report`
    required: true
  fail-on-no-go:
    description: fail the job when the status is a failure; Coverage's job also builds and tests, so it reports by status only
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      run: cat "${{ inputs.directory }}/comment.md" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/github-script@v7
      env:
        REPORT_DIRECTORY: ${{ inputs.directory }}
      with:
        script: |
          const fs = require("fs");
          const directory = process.env.REPORT_DIRECTORY;
          const limit = 65000; // GitHub refuses a comment body over 65536 characters
          let body = fs.readFileSync(`${directory}/comment.md`, "utf8");
          if (body.length > limit) {
            body = `${body.slice(0, limit)}\n\n… cut at ${limit} characters; the job summary has it all`;
          }
          const status = JSON.parse(fs.readFileSync(`${directory}/status.json`, "utf8"));
          const pullRequest = context.payload.pull_request;
          const fromFork = pullRequest && pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
          if (fromFork) {
            core.notice(`${status.context}: ${status.description} (a fork's pull request: summary only)`);
            return;
          }
          await github.rest.repos.createCommitStatus({
            ...context.repo,
            sha: pullRequest ? pullRequest.head.sha : context.sha,
            state: status.state,
            context: status.context,
            description: status.description,
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
          });
          if (!pullRequest) {
            return;
          }
          const marker = body.split("\n")[0];
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pullRequest.number, per_page: 100 });
          const sticky = comments.find((comment) => comment.body.startsWith(marker));
          if (sticky) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: sticky.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: pullRequest.number, body });
          }

    - if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.directory }}
        overwrite: true
        path: |
          ${{ inputs.directory }}/figures.csv
          ${{ inputs.directory }}/history-report.txt

    - if: inputs.fail-on-no-go == 'true'
      shell: bash
      env:
        REPORT_DIRECTORY: ${{ inputs.directory }}
      run: |
        if grep -q '"state": "failure"' "$REPORT_DIRECTORY/status.json"; then
          echo "::error::no-go: $(cat "$REPORT_DIRECTORY/status.json")"
          exit 1
        fi
